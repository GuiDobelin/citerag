services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - citerag-data:/data

  # Opt in with: docker compose --profile qdrant up
  # and set CITERAG_STORE=qdrant / CITERAG_QDRANT_URL=http://qdrant:6333 in .env
  qdrant:
    image: qdrant/qdrant:v1.15.4
    profiles: ["qdrant"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  citerag-data:
  qdrant-data:
