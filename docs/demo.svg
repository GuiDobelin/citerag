<svg xmlns="http://www.w3.org/2000/svg" width="809" height="406" viewBox="0 0 809 406" role="img" aria-label="citerag ingesting two files and streaming a cited answer">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;white-space:pre;fill:#d4d4d4}
